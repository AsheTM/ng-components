
<div class="dialog"
  tabindex="-1"
  aria-modal="true"
  [attr.role]="role"
  [attr.aria-labelledby]="title ? dialogId + '-title' : null"
  [attr.aria-describedby]="body ? dialogId + '-body' : null">
  <div *ngIf="title"
    class="dialog-header"
    [id]="dialogId + '-title'">{{ title }}</div>

  <div *ngIf="body || template"
    class="dialog-body"
    [id]="dialogId + '-body'"
    [ngSwitch]="type">
    <ng-template *ngIf="template"
      [ngSwitchCase]="'form'"
      [ngTemplateOutlet]="template"></ng-template>

    <ng-template [ngSwitchDefault]>{{ body }}</ng-template>
  </div>

  <div *ngIf="closeLabel || okLabel"
    class="dialog-footer">
    <ng-container [ngSwitch]="type">
      <ng-template [ngSwitchCase]="'confirm'">
        <button class="primary"
          type="button"
          (click)="onOkClickEventHandler()">{{ okLabel }}</button>
      </ng-template>

      <ng-template [ngSwitchCase]="'form'">
        <button class="primary"
          type="button"
          (click)="onOkClickEventHandler()">{{ okLabel }}</button>
      </ng-template>
    </ng-container>

    <button class="secondary"
      type="button"
      (click)="onCloseClickEventHandler()">{{ closeLabel }}</button>
  </div>
</div>
